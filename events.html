<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talent Search - Events</title>
  <style>
    :root {
      --sky-600: #7eb3ce;
      --sky-500: #9ecae1;
      --sky-400: #add8e6;
      --sky-200: #d6f0fa;
      --sky-100: #eaf6fb;
      --sky-50: #f4fafe;
      --ink-900: #0f1f2b;
      --ink-800: #1b2f40;
      --ink-700: #2a3f52;
      --ink-500: #647b8f;
      --ink-400: #8c9fae;
      --white: #ffffff;

      --shadow-sm: 0 4px 12px rgba(15, 31, 43, 0.05);
      --shadow-md: 0 10px 30px rgba(15, 31, 43, 0.08);
      --shadow-lg: 0 20px 40px rgba(15, 31, 43, 0.12);
      --shadow-glow: 0 0 20px rgba(158, 202, 225, 0.4);

      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;

      --transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      --transition-bounce: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink-900);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    /* Scroll Bar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--white);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--sky-200);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--sky-400);
    }

    /* Scroll Progress */
    .progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 100;
    }

    .progress-bar-scroll {
      height: 100%;
      background: linear-gradient(90deg, var(--sky-400), var(--sky-600));
      width: 0%;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(158, 202, 225, 0.7);
      }

      70% {
        box-shadow: 0 0 0 15px rgba(158, 202, 225, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(158, 202, 225, 0);
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Background Visuals */
    #app {
      min-height: 100vh;
      position: relative;
      z-index: 1;
      padding-bottom: 60px;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(180deg, #f9fdff 0%, #ffffff 100%);
    }

    .bg-blob {
      position: absolute;
      filter: blur(80px);
      opacity: 0.5;
      border-radius: 50%;
    }

    .blob-1 {
      top: -10%;
      right: -5%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, var(--sky-200) 0%, transparent 70%);
    }

    .blob-2 {
      bottom: 20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--sky-100) 0%, transparent 70%);
    }

    /* Navbar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      transition: all var(--transition);
    }

    .topbar.scrolled {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-sm);
      border-bottom-color: rgba(15, 31, 43, 0.05);
      padding: 5px 0;
    }

    .nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: padding var(--transition);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
      color: var(--ink-900);
    }

    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      object-fit: cover;
    }

    .menu {
      display: flex;
      gap: 4px;
    }

    .menu a {
      position: relative;
      padding: 10px 16px;
      color: var(--ink-700);
      font-weight: 500;
      font-size: 0.95rem;
      border-radius: 999px;
      transition: all var(--transition);
      z-index: 1;
    }

    .menu a.active {
      color: var(--sky-600);
      background: var(--sky-50);
    }

    .menu a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--sky-50);
      border-radius: 999px;
      z-index: -1;
      transform: scale(0.8);
      opacity: 0;
      transition: all var(--transition-bounce);
    }

    .menu a:hover {
      color: var(--sky-600);
    }

    .menu a:hover::before {
      transform: scale(1);
      opacity: 1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(15, 31, 43, 0.08);
      background: var(--white);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all var(--transition-bounce);
      position: relative;
      color: var(--ink-700);
    }

    .icon-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--sky-200);
      color: var(--sky-600);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
    }

    .icon-dot {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      background: #ff4757;
      border-radius: 50%;
      box-shadow: 0 0 0 2px var(--white);
      animation: pulse 2s infinite;
    }

    .profile {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(15, 31, 43, 0.08);
      display: grid;
      place-items: center;
      background: var(--white);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-bounce);
    }

    .profile:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--sky-200);
    }

    /* Notification Dropdown */
    .notification-panel {
      position: absolute;
      top: calc(100% + 16px);
      right: 0;
      width: 380px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      transform: translateY(15px) scale(0.95);
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-bounce);
      transform-origin: top right;
      z-index: 40;
    }

    .notification-panel.open {
      transform: translateY(0) scale(1);
      opacity: 1;
      visibility: visible;
      display: block;
    }

    .notification-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    .notification-item {
      padding: 16px;
      background: var(--sky-50);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      border: 1px solid var(--sky-100);
      transition: all 0.2s;
    }

    .notification-item:hover {
      background: var(--sky-100);
      transform: translateX(5px);
    }

    .notification-item p {
      font-size: 0.9rem;
      color: var(--ink-800);
      margin-bottom: 12px;
    }

    .notification-actions {
      display: flex;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 40px;
      padding: 0 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all var(--transition-bounce);
      position: relative;
      overflow: hidden;
    }

    .notif-btn {
      background: linear-gradient(135deg, var(--sky-500), var(--sky-400));
      color: var(--ink-900);
      box-shadow: var(--shadow-glow), var(--shadow-sm);
      border: none;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .notif-btn.secondary {
      background: var(--white);
      color: var(--ink-900);
      border: 1px solid rgba(15, 31, 43, 0.1);
      box-shadow: var(--shadow-sm);
    }

    /* Main Page injected by JS */
    .page-wrap {
      padding-top: 100px;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .page-head {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-xl);
      padding: 48px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.8s ease-out;
    }

    .page-head::after {
      content: "";
      position: absolute;
      inset: auto -12% -42% auto;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(158, 202, 225, 0.2), transparent);
      z-index: -1;
    }

    .page-head h1 {
      font-size: clamp(2.5rem, 4vw, 3.5rem);
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--ink-900);
    }

    .page-head .head-subtext {
      font-size: 1.15rem;
      color: var(--ink-500);
      max-width: 600px;
    }

    /* Initiatives Grid from main.js output */
    .initiatives-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    .initiative-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(15, 31, 43, 0.05);
      transition: all var(--transition-bounce);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      animation: fadeUp 0.8s ease-out backwards;
    }

    .initiative-card:nth-child(2) {
      animation-delay: 0.1s;
    }

    .initiative-card:nth-child(3) {
      animation-delay: 0.2s;
    }

    .initiative-card:nth-child(4) {
      animation-delay: 0.3s;
    }

    .initiative-card:nth-child(5) {
      animation-delay: 0.4s;
    }

    .initiative-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      border-color: var(--sky-200);
    }

    .card-link {
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: none;
    }

    .card-image {
      height: 180px;
      background: linear-gradient(140deg, var(--sky-100), var(--sky-200));
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-image::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      top: 20px;
      right: -20px;
      transition: transform var(--transition);
    }

    .card-image::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(158, 202, 225, 0.3);
      bottom: -60px;
      left: -40px;
      transition: transform var(--transition);
    }

    .card-icon-overlay {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--white);
      display: grid;
      place-items: center;
      color: var(--sky-600);
      box-shadow: var(--shadow-md);
      position: relative;
      z-index: 5;
      transition: transform var(--transition-bounce);
    }

    /* JS will inject SVG icon into card-image */
    .initiative-card:hover .card-image::before {
      transform: translate(-20px, 20px) scale(1.2);
    }

    .initiative-card:hover .card-image::after {
      transform: translate(20px, -20px) scale(1.1);
    }

    .initiative-card:hover .card-icon-overlay {
      transform: scale(1.1) rotate(5deg);
      background: var(--sky-500);
      color: var(--white);
    }

    .card-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-content h3 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink-900);
    }

    .card-content p {
      margin: 0 0 20px;
      color: var(--ink-500);
      line-height: 1.6;
      flex-grow: 1;
      font-size: 0.95rem;
    }

    .card-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
    }

    .initiative-card:hover .card-meta {
      max-height: 150px;
      opacity: 1;
      margin-top: 10px;
    }

    .card-meta span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--sky-50);
      color: var(--sky-600);
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid var(--sky-100);
      width: fit-content;
    }

    .card-points {
      background: #fefce8 !important;
      color: #eab308 !important;
      border-color: #fef08a !important;
    }

    /* Footer CTA Card */
    .footer-cta {
      margin-top: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 32px 40px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--sky-50) 0%, var(--white) 100%);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--sky-100);
      animation: fadeUp 1s ease-out backwards;
      animation-delay: 0.5s;
    }

    .footer-cta span {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--ink-800);
    }

    .footer-cta a {
      background: linear-gradient(135deg, var(--sky-500), var(--sky-400));
      color: var(--ink-900);
      box-shadow: var(--shadow-glow), var(--shadow-sm);
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      transition: all var(--transition-bounce);
    }

    .footer-cta a:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(158, 202, 225, 0.6);
    }

    @media (max-width: 980px) {
      .menu {
        display: none;
      }

      .initiatives-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .footer-cta {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding-top: 100px;
      }

      .page-head {
        padding: 32px 24px;
      }

      .initiatives-grid {
        grid-template-columns: 1fr;
      }

      .card-meta {
        max-height: 150px;
        opacity: 1;
        margin-top: 10px;
      }
    }
  </style>

</head>

<body>
  <div class="progress-container">
    <div class="progress-bar-scroll" id="scrollProgress"></div>
  </div>

  <div class="bg-layer">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
  </div>

  <div id="app"></div>

  <!-- We load main.js which mounts header and cards into #app -->
  <script src="main.js"></script>
  <script>
    // Setup the new JS features after main.js mounts elements
    setTimeout(() => {
      // Navbar Scroll
      const navbar = document.querySelector('.topbar');
      if (navbar) navbar.id = "navbar";
      const scrollProgress = document.getElementById('scrollProgress');
      window.addEventListener('scroll', () => {
        if (window.scrollY > 20 && navbar) navbar.classList.add('scrolled');
        else if (navbar) navbar.classList.remove('scrolled');

        const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        const scrolled = (height > 0) ? (winScroll / height) * 100 : 0;
        scrollProgress.style.width = scrolled + "%";
      });

      // Modify main.js injected styles slightly if needed:
      document.querySelectorAll('.icon-btn').forEach(btn => btn.id = "notifToggle");
      document.querySelectorAll('.notification-panel').forEach(p => p.id = "notifDropdown");

      // Add SVG icons to newly generated cards from main.js
      const colors = [
        { bg: 'linear-gradient(140deg, #eff6ff, #bfdbfe)', color: '#3b82f6' },
        { bg: 'linear-gradient(140deg, #fefce8, #fef08a)', color: '#eab308' },
        { bg: 'linear-gradient(140deg, #f0fdf4, #bbf7d0)', color: '#22c55e' },
        { bg: 'linear-gradient(140deg, #fdf4ff, #fbcfe8)', color: '#ec4899' },
        { bg: 'linear-gradient(140deg, #faf5ff, #e9d5ff)', color: '#a855f7' }
      ];

      document.querySelectorAll('.initiative-card').forEach((card, index) => {
        const img = card.querySelector('.card-image');
        if (img) {
          const style = colors[index % colors.length];
          img.style.background = style.bg;

          const iconBox = document.createElement('div');
          iconBox.className = 'card-icon-overlay';
          iconBox.style.color = style.color;
          iconBox.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
          img.appendChild(iconBox);
        }
      });

      // Fix menu logo icon
      const menuDot = document.querySelector('.icon-dot');
      const toggle = document.querySelector('.notification-toggle');
      if (toggle && !toggle.innerHTML.includes('svg')) {
        toggle.innerHTML = '';
        if (menuDot) toggle.appendChild(menuDot);
        toggle.innerHTML += '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>';
      }

    }, 300); // 300ms wait for main.js to execute
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const role = localStorage.getItem('userRole');
      if (role === 'employee') {
        // Hide 'Posted Opportunities' in navbar or anywhere
        document.querySelectorAll('a[href="posted-opportunities.html"]').forEach(el => el.style.display = 'none');

        // Hide any explicitly named 'Post Opportunity' buttons/links connecting to add-opportunity.html
        document.querySelectorAll('a[href="add-opportunity.html"]').forEach(el => el.style.display = 'none');

        // Hide dynamically labeled matching interface elements
        document.querySelectorAll('button, .btn').forEach(btn => {
          if (btn.textContent.includes('Post Opportunity')) {
            btn.style.display = 'none';
          }
        });
      }
    });
  </script>

    <script src="chatbot.js"></script>
<script src="role-permissions.js"></script>
    <script src="header.js"></script>
</body>


</html>
