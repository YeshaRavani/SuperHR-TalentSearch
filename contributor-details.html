<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>User Sign Up — Talent Search</title>
    <link rel="stylesheet" href="css/contributor-details.css" />

    <link rel="stylesheet" href="css/chatbot.css" />

    <script src="js/opportunities_data.js"></script>
    <link rel="stylesheet" href="css/header.css" />
</head>

<body>
    <div class="progress-container">
        <div class="progress-bar-scroll" id="scrollProgress"></div>
    </div>

    <div class="bg-layer">
        <div class="bg-blob blob-1"></div>
        <div class="bg-blob blob-2"></div>
    </div>

    <header class="topbar" id="navbar">
        <div class="nav">
            <a href="index (1).html" class="logo" title="Go to home" aria-label="Go to home" style="text-decoration: none; color: inherit;">
                <img class="logo-img" src="assets/logo.png" alt="Talent Search logo" />
                Talent Search
            </a>
            <nav class="menu">
                <ul>
                    <li><a href="index (1).html">Home</a></li>
                    <li><a href="opportunities.html">Opportunities</a></li>
                    <li><a href="posted-opportunities.html">Posted Opportunities</a></li>
                    <li><a href="community.html">Community</a></li>
                    <li><a href="aboutus.html">About Us</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <div class="notification-wrap">
                    <button class="icon-btn notification-toggle" aria-label="Notifications" aria-haspopup="true"
                        aria-expanded="false">
                        <span class="icon-dot"></span>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </button>
                    <div class="notification-panel" role="menu" aria-label="Notifications">
                        <h3 class="notification-head">Notifications</h3>
                        <div class="notification-item">
                            <p>Interest matched: "Campus Sustainability Sprint". Do you want to enroll?</p>
                            <div class="notification-actions">
                                <button class="notif-btn">Enroll</button>
                                <button class="notif-btn secondary">Later</button>
                            </div>
                        </div>
                        <div class="notification-item">
                            <p>You have a new workshop recommendation based on your recent activity.</p>
                        </div>
                    </div>
                </div>
                <a href="login.html" class="login-btn">Login</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="main-card">
            <h1 class="title">Sign Up</h1>

            <form class="form" onsubmit="handleSignupNext(event);">
                <div class="form-group">
                    <label class="form-label" for="fullname">Full Name</label>
                    <input id="fullname" class="text-input" placeholder="Enter your full name" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="organization">Organization / University</label>
                    <input id="organization" class="text-input" placeholder="Enter your university or organization"
                        required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="idnumber">ID Number</label>
                    <input id="idnumber" class="text-input" placeholder="Enter your contributors ID or equivalent"
                        required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input id="username" class="text-input" placeholder="Choose a username" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input id="password" class="text-input" type="password" placeholder="Create a password" required />
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password</label>
                    <input id="confirmPassword" class="text-input" type="password" placeholder="Confirm your password"
                        required />
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-sky">Next →</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/contributor-details.js"></script>

    

    <script src="js/chatbot.js"></script>
<script src="js/role-permissions.js"></script>
    <script src="js/header.js"></script>
    <script>
        function handleSignupNext(e) {
            e.preventDefault();
            const fullname = document.getElementById('fullname').value;
            const org = document.getElementById('organization').value;
            const idnum = document.getElementById('idnumber').value;
            const user = document.getElementById('username').value;
            
            localStorage.setItem('signup_fullname', fullname);
            localStorage.setItem('signup_organization', org);
            localStorage.setItem('signup_id', idnum);
            localStorage.setItem('signup_username', user);
            
            window.location.href = 'contributor-profile.html';
        }
    </script>
</body>


</html>
