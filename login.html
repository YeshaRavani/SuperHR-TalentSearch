<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Talent Search</title>
  <link rel="stylesheet" href="css/login.css" />


  <script src="js/opportunities_data.js"></script>
    <link rel="stylesheet" href="css/header.css" />
</head>

<body>
  <div class="bg-layer">
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
  </div>

  <div class="page-wrap">
    <header class="topbar">
      <div class="nav">
        <a href="index (1).html" class="logo" title="Go to home" aria-label="Go to home" style="text-decoration: none; color: inherit;">
          <img class="logo-img" src="assets/logo.png" onerror="this.src='https://via.placeholder.com/88/9ecae1/ffffff?text=TS'"
            alt="Logo" />
          Talent Search
        </a>
        <nav class="menu">
                <ul>
                    <li><a href="index (1).html">Home</a></li>
                    <li><a href="opportunities.html">Opportunities</a></li>
                    <li><a href="posted-opportunities.html">Posted Opportunities</a></li>
                    <li><a href="community.html">Community</a></li>
                    <li><a href="aboutus.html">About Us</a></li>
                </ul>
            </nav>
        <div class="nav-spacer" style="width: 176px; pointer-events: none;"></div>
      </div>
    </header>

    <main class="container">
      <div class="auth-card" id="card">

        <!-- Initial View -->
        <div id="initialView" class="view active">
          <div class="avatar-lg">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <h2>Welcome back</h2>
          <p class="subtitle">Access your opportunities and matches.</p>

          <div class="stack">
            <button id="openLoginBtn" class="btn btn-sky">Login</button>
            <a href="signup.html" class="btn btn-secondary">Create an account</a>
          </div>
        </div>

        <!-- Form View -->
        <div id="formView" class="view hidden">
          <h2>Sign in</h2>
          <p class="subtitle" style="margin-bottom: 24px;">Enter your details to continue.</p>

          <div class="stack">
            <div class="floating-group">
              <input id="username" class="floating-input" type="text" placeholder=" " />
              <label for="username" class="floating-label">Username or Email</label>
            </div>

            <div class="floating-group">
              <input id="password" class="floating-input" type="password" placeholder=" " />
              <label for="password" class="floating-label">Password</label>
            </div>

            <button id="formLoginBtn" class="btn btn-sky" style="margin-top: 8px;">Login</button>
            <button id="backBtn" class="btn btn-outline" style="height: 40px;">← Back</button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="js/login.js"></script>

    <script src="js/header.js"></script>
</body>


</html>
