<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profile Setup — Talent Search</title>
  <link rel="stylesheet" href="css/profilesetup.css" />

    <link rel="stylesheet" href="css/chatbot.css" />

    <script src="js/opportunities_data.js"></script>
    <link rel="stylesheet" href="css/header.css" />
</head>

<body>
  <header class="topbar">
    <div class="nav">
      <a href="index (1).html" class="logo" title="Go to home" aria-label="Go to home" style="text-decoration: none; color: inherit;">
        <img class="logo-img" src="assets/logo.png" alt="Talent Search logo" />
        Talent Search
      </a>
      <nav class="menu">
        <a href="index (1).html">Home</a>
        <a href="opportunities.html">Opportunities</a>
        <a href="aboutus.html">About Us</a>
      </nav>
      <div class="nav-actions">
        <div class="notification-wrap">
          <button class="icon-btn notification-toggle" aria-label="Notifications" aria-haspopup="true"
            aria-expanded="false">
            <span class="icon-dot"></span>
            <span>🔔</span>
          </button>
          <div class="notification-panel" role="menu" aria-label="Notifications">
            <h3 class="notification-head">Notifications</h3>
            <div class="notification-item">
              <p>Interest matched: "Campus Sustainability Sprint". Do you want to enroll?</p>
              <div class="notification-actions">
                <button class="notif-btn">Enroll</button>
                <button class="notif-btn secondary">Later</button>
              </div>
            </div>
          </div>
        </div>
        <a href="login.html" class="login-btn">Login</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div>
        <div class="title">Profile Setup</div>
        <div class="subtitle">Set up your profile to get better recommendations</div>
      </div>

      <form class="form" id="setupForm" onsubmit="return false;">
        <input id="team" class="text-input" placeholder="What team do you currently work with?" />
        <textarea id="job" class="text-input" placeholder="What is your job description?"></textarea>
        <div>
          <label for="resume" style="display:block; margin-bottom:8px; color:var(--ink-700);">Upload your resume</label>
          <input id="resume" type="file" accept=".pdf,.doc,.docx" class="text-input" style="padding:8px;" />
        </div>

        <div class="actions">
          <button id="finishBtn" type="button" class="primary-btn">Finish</button>
        </div>
      </form>
    </div>
  </main>

  <script src="js/profilesetup.js"></script>

  

    <script src="js/chatbot.js"></script>
<script src="js/role-permissions.js"></script>
    <script src="js/header.js"></script>
</body>

</html>
